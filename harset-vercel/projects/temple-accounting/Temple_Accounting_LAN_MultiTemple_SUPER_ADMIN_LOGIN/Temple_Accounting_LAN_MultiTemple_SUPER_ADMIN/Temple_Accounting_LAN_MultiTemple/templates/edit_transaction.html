<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Transaction</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="reportbar"><a href="/dashboard">← Super Admin Dashboard</a><strong>🔐 Super Admin Only</strong></div><main class="wide"><section class="panel"><h2>Modify Accounting Transaction</h2><div class="notice">This page is protected server-side. Temple users cannot access it.</div><form method="post" class="form"><div><label>Type</label><select name="txn_type" id="type" onchange="toggleDonor()"><option value="donation" {% if tx.txn_type=='donation' %}selected{% endif %}>Donation / Income</option><option value="expense" {% if tx.txn_type=='expense' %}selected{% endif %}>Expense</option></select></div><div><label>Date</label><input type="date" name="txn_date" value="{{tx.txn_date}}" required></div><div><label>Reason / Details</label><select name="purpose" id="purpose" required>
<option value="{{tx.purpose}}" selected>{{tx.purpose}}</option>
{% for item in INCOME_CATEGORIES %}<option class="income-option" value="{{item}}">{{item}}</option>{% endfor %}
{% for item in EXPENSE_CATEGORIES %}<option class="expense-option" value="{{item}}">{{item}}</option>{% endfor %}
</select></div><div id="donor"><label>Donor Name</label><input name="donor" value="{{tx.donor or ''}}"></div><div><label>Amount (₹)</label><input type="number" name="amount" min="0.01" step="0.01" value="{{tx.amount}}" required></div><div><label>Payment Mode</label><select name="payment_mode"><option {% if tx.payment_mode=='UPI' %}selected{% endif %}>UPI</option><option {% if tx.payment_mode=='Cash' %}selected{% endif %}>Cash</option><option {% if tx.payment_mode=='Bank' %}selected{% endif %}>Bank</option></select></div><div><label>Receipt / Voucher No.</label><input name="reference_no" value="{{tx.reference_no or ''}}"></div><button class="green">Save Changes</button></form></section></main><script>function toggleDonor(){const isIncome=document.getElementById('type').value==='donation';document.getElementById('donor').style.display=isIncome?'block':'none';const select=document.getElementById('purpose');Array.from(select.options).forEach((o,i)=>{if(i===0)return;o.hidden=isIncome?!o.classList.contains('income-option'):!o.classList.contains('expense-option')})}toggleDonor();</script></body></html>
