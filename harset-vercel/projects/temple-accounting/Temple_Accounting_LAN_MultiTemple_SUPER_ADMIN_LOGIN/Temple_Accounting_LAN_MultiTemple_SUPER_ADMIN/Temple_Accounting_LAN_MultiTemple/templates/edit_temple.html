<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Temple Account</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="reportbar"><a href="/admin/temples">← Temple Accounts</a><strong>🔐 Super Admin Only</strong></div><main class="wide"><section class="panel"><h2>Modify Temple Registration</h2><div class="notice">Only the Super Admin can change a temple name, address, username, or reset its password.</div><form method="post" class="form"><div><label>Temple Name</label><input name="name" value="{{temple.name}}" required></div><div><label>Address</label><input name="address" value="{{temple.address or ''}}"></div><div><label>Temple Username</label><input name="username" value="{{user.username if user else ''}}" required></div><div><label>New Password</label><input name="password" type="password" minlength="8" placeholder="Leave blank to keep current password"></div><button class="green">Save Temple Account</button></form></section></main></body></html>
