<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Log</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="reportbar"><a href="/dashboard">← முகப்பு</a></div><main class="wide"><section class="panel"><h2>செயல் பதிவு / Audit Log</h2><table><tr>{% if super_admin %}<th>Temple</th>{% endif %}<th>Time</th><th>Action</th><th>Details</th></tr>{% for r in rows %}<tr>{% if super_admin %}<td>{{r.temple_name}}</td>{% endif %}<td>{{r.created_at}}</td><td>{{r.action}}</td><td>{{r.details}}</td></tr>{% endfor %}</table></section></main></body></html>
